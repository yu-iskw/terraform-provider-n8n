# Local / CI fixture for n8n_project acceptance tests.
# Speaks the n8n Public API project contract on :5678 without an Enterprise license.

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.acc-fixture
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_API_KEY: tf-acc-fixture-key
