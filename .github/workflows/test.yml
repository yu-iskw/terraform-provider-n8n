# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches:
      - main
    paths-ignore:
      - README.md

# Testing only needs permissions to read the repository contents.
permissions: read-all

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Required: allow read access to the content for analysis.
      contents: read
      # Optional: allow read access to pull request. Use with `only-new-issues` option.
      pull-requests: read
      # Optional: Allow write access to checks to allow the action to annotate code in the PR.
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          go mod download
          go mod vendor
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # Pin to match .terraform-version / local docs generation. `latest` drifts
          # Optional+Computed / write-only schema rendering across Terraform releases.
          terraform_version: 1.11.0
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          if ! git diff --compact-summary --exit-code; then
            echo
            echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."
            echo
            git --no-pager diff -- docs/ examples/ || true
            exit 1
          fi

  # Unit tests across supported Terraform CLI versions (no live n8n; TF_ACC unset).
  test:
    name: Terraform Provider Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - 1.11.*
          - 1.12.*
          - 1.13.*
          - 1.14.*
          - 1.15.*
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Download dependencies
        run: |
          go mod download
      - name: Run unit tests
        run: |
          go test -v -cover ./internal/...

  # Acceptance tests against pinned Community n8n (docker-compose.dev.yml).
  # Bootstrap mints a Public API key via /rest; tests call /api/v1 only.
  # Licensed APIs (n8n_project, n8n_folder) skip on Community 403.
  # Credential CRUD is available on Community (write-only data needs Terraform 1.11+).
  testacc:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.*
          terraform_wrapper: false
      - name: Download dependencies
        run: go mod download
      - name: Start Community n8n
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 180
      - name: Bootstrap owner and Public API key
        run: scripts/bootstrap-n8n.sh --github-env
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_VERSION: 1.15.0
        run: go test -v -cover ./internal/provider/ -timeout 20m
      - name: Stop n8n
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # Run gosec security scanner
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go mod download
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec Security Scanner
        run: |
          gosec ./internal/...

  # Run deadcode scanner
  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependencies
        run: |
          go mod download
      - name: Run Deadcode
        run: |
          go run golang.org/x/tools/cmd/deadcode -test ./internal/...
