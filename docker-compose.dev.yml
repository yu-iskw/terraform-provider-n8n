# Local / CI n8n fixture for Terraform provider acceptance tests.
# Slim CE stack only — do not copy the official AI-sandbox Compose.
# Pin: n8n@2.35.5 (https://github.com/n8n-io/n8n/releases/tag/n8n%402.35.5)

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.5
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: terraform-provider-n8n-dev-only-not-a-secret
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    # No named volume: ephemeral SQLite so each up is a clean instance.
    healthcheck:
      # Prefer /healthz/readiness (DB migrated). Probe with Node — official
      # image has no curl/wget HEALTHCHECK and wget has been dropped in some tags.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
